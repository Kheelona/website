# Test store sync (K-182, D071 (K-182)): keeps the branch `beta` equal to `main`.
# Vercel builds `beta` as the test store (betastore.kheelona.com, betawebsite.kheelona.com, Razorpay Test
# Mode, a separate test Supabase project). `beta` is a pointer, not a place to work: nobody commits on it,
# this workflow overwrites it. It writes only refs/heads/beta and nothing else.
#   - On every push to main, beta is set to that commit.
#   - "Run workflow" (Actions -> test-store-sync) with `ref` = a PR's branch or a commit puts that code on the
#     test store for a pre-merge test. The next merge to main (or a run with ref = main) puts main back.
# The `ref` input is used only as the checkout's `ref:`, never inside a `run:` script. It runs only on pushes
# to main and on a manual run, never for pull requests, so the optional secret below is never exposed to forks.
# With the default token GitHub starts no other workflow (so not verify.yml) for the push, and the push cannot
# carry changes to .github/workflows: such a run fails and beta stays where it was, unless the optional
# TEST_STORE_SYNC_TOKEN secret is set (wiki/engineering/architecture.md §15.7).
name: test-store-sync

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch or commit to put on the test store: main, or a PR's branch"
        type: string
        required: true
        default: main

permissions:
  contents: write

concurrency:
  group: test-store-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.sha }}
          # Optional repo secret: a fine-grained token (this repo only; Contents and Workflows: read and write) lets a
          # sync carry workflow-file changes, which the default token may not push. Without it, the default token is used.
          token: ${{ secrets.TEST_STORE_SYNC_TOKEN || github.token }}
      - name: Point beta at the checked-out commit
        run: |
          git push --force origin HEAD:refs/heads/beta
          echo "The test store branch beta now points at $(git rev-parse --short HEAD)." >> "$GITHUB_STEP_SUMMARY"
