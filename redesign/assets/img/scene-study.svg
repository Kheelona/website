<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMax slice">
  <defs>
    <linearGradient id="w" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6faff"/><stop offset="1" stop-color="#e7f0fa"/></linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#cfe6fb"/><stop offset="1" stop-color="#eef7ff"/></linearGradient>
    <radialGradient id="lamp" cx=".5" cy="0" r="1"><stop offset="0" stop-color="#fff2cf" stop-opacity=".95"/><stop offset="1" stop-color="#fff2cf" stop-opacity="0"/></radialGradient>
    <linearGradient id="desk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f1e3d1"/><stop offset="1" stop-color="#e2cdb2"/></linearGradient>
  </defs>
  <rect width="1600" height="1000" fill="url(#w)"/>
  <!-- window -->
  <rect x="1050" y="140" width="380" height="420" rx="28" fill="#fff"/>
  <rect x="1070" y="160" width="340" height="380" rx="18" fill="url(#sky)"/>
  <ellipse cx="1180" cy="270" rx="70" ry="26" fill="#fff"/><ellipse cx="1230" cy="258" rx="50" ry="30" fill="#fff"/>
  <ellipse cx="1330" cy="380" rx="56" ry="20" fill="#fff" opacity=".9"/>
  <rect x="1236" y="160" width="8" height="380" fill="#fff"/>
  <!-- shelf with books -->
  <rect x="170" y="300" width="460" height="14" rx="7" fill="#d9c3a5"/>
  <g>
    <rect x="200" y="196" width="34" height="104" rx="6" fill="#f2a5a0"/><rect x="238" y="210" width="30" height="90" rx="6" fill="#9fc6ec"/>
    <rect x="272" y="186" width="38" height="114" rx="6" fill="#ffd98a"/><rect x="314" y="204" width="28" height="96" rx="6" fill="#b6a6ee"/>
    <rect x="352" y="222" width="80" height="78" rx="10" transform="rotate(-12 392 261)" fill="#a8dcc5"/>
  </g>
  <!-- rocket poster -->
  <rect x="470" y="140" width="130" height="150" rx="14" fill="#fff"/>
  <path d="M535 170 q30 40 22 92 h-44 q-8-52 22-92z" fill="#ff8f6b"/><circle cx="535" cy="214" r="11" fill="#cfe6fb"/>
  <path d="M513 262 l-14 18 h18z M557 262 l14 18 h-18z" fill="#ffc861"/>
  <!-- lamp glow -->
  <polygon points="380,470 220,830 560,830" fill="url(#lamp)" opacity=".8"/>
  <path d="M330 470 h110 l-30-60 h-50z" fill="#ffcf7a"/><rect x="380" y="470" width="10" height="250" rx="5" fill="#cbb79e"/>
  <ellipse cx="385" cy="822" rx="70" ry="12" fill="#cbb79e"/>
  <!-- desk -->
  <rect x="0" y="820" width="1600" height="30" fill="url(#desk)"/>
  <rect x="0" y="850" width="1600" height="150" fill="#d8c1a3"/>
  <!-- globe -->
  <circle cx="1180" cy="720" r="74" fill="#bfe0f6"/><path d="M1130 690 q30-20 50 0 t40 30 q-30 30-60 10z M1150 760 q30-10 60 10 q-30 20-50 10z" fill="#9fd08f"/>
  <path d="M1100 720 a80 80 0 0 0 160 0" fill="none" stroke="#c9a37a" stroke-width="8"/><rect x="1172" y="796" width="16" height="24" fill="#c9a37a"/><ellipse cx="1180" cy="820" rx="44" ry="8" fill="#c9a37a"/>
  <!-- pencils + notebook -->
  <rect x="1320" y="736" width="70" height="84" rx="16" fill="#fff"/>
  <rect x="1334" y="690" width="10" height="60" rx="5" fill="#ffd36e"/><rect x="1352" y="680" width="10" height="70" rx="5" fill="#f2a5a0"/><rect x="1370" y="696" width="10" height="56" rx="5" fill="#9fc6ec"/>
  <rect x="520" y="800" width="190" height="20" rx="6" fill="#fff"/><rect x="520" y="800" width="190" height="6" rx="3" fill="#b6a6ee"/>
</svg>
