  <g fill="#c9bdf2"><path d="M200 200 l14 26 h-28z"/><path d="M330 215 l14 26 h-28z"/><path d="M470 195 l14 26 h-28z"/><path d="M600 215 l14 26 h-28z"/><path d="M730 200 l14 26 h-28z"/></g>
