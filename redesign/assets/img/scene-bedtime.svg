  <path d="M760 660 q300-40 700 0 v160 h-700z" fill="#e2daf7"/>
  <g fill="#cdc2ef"><circle cx="880" cy="720" r="8"/><circle cx="1000" cy="760" r="8"/><circle cx="1120" cy="710" r="8"/><circle cx="1240" cy="750" r="8"/><circle cx="1360" cy="715" r="8"/></g>
  <rect x="0" y="820" width="1600" height="180" fill="#ddd5f2"/>
