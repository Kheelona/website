  <rect x="1090" y="730" width="100" height="92" rx="20" fill="#fff"/><path d="M1190 752 q44 0 44 30 t-44 30" fill="none" stroke="#fff" stroke-width="14"/>
  <path class="steam" d="M1120 700 q-16-30 0-60 t0-60" fill="none" stroke="#e9d9c8" stroke-width="7" stroke-linecap="round"/>
  <path class="steam" d="M1160 700 q16-30 0-60 t0-60" fill="none" stroke="#e9d9c8" stroke-width="7" stroke-linecap="round"/>
  <!-- fruit bowl -->
