<!doctype html>
<!-- @dsCard group="Logo" name="Construction & specs" subtitle="Clear space, ratio, outline, shadow" viewport="720x360" -->
<html><head><meta charset="utf-8"><title>Construction and specs</title>
<link rel="stylesheet" href="_card.css">
<style>
  .g { display: grid; grid-template-columns: 1.5fr 1fr; gap: 16px; align-items: center; }
  .g img { width: 100%; border-radius: 10px; border: 1px solid var(--kh-line); }
  table { border-collapse: collapse; width: 100%; font-size: 12.5px; }
  td { padding: 7px 10px; border-bottom: 1px solid var(--kh-line); color: var(--kh-ink-2); }
  td:first-child { color: var(--kh-ink-3); white-space: nowrap; }
  td:last-child { color: var(--kh-ink); font-weight: 600; }
</style></head>
<body><div class="card">
  <div class="g">
    <img src="../assets/logo/logo-construction-grid.png" alt="Construction grid">
    <table>
      <tr><td>Reference size</td><td>557 × 155 (≈ 3.59 : 1)</td></tr>
      <tr><td>Clear space</td><td>10 × 3 unit grid; ≥ 1 unit each side</td></tr>
      <tr><td>Sticker outline</td><td>White, weight 5, outside</td></tr>
      <tr><td>Drop shadow</td><td>X 0 · Y 4 · blur 4 · black 25%</td></tr>
      <tr><td>Colors</td><td>#29A0D7 · #EF762F · #FFFFFF</td></tr>
    </table>
  </div>
  <p class="note">Source spec panels preserved in assets/logo/spec-*.png.</p>
</div></body></html>
