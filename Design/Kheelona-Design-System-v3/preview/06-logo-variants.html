<!doctype html>
<!-- @dsCard group="Logo" name="Logo on backgrounds" subtitle="Full color on light · white on brand colors" viewport="720x340" -->
<html><head><meta charset="utf-8"><title>Logo on backgrounds</title>
<link rel="stylesheet" href="_card.css">
<style>
  .g { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .tile { border-radius: 12px; display: flex; align-items: center; justify-content: center; padding: 22px; }
  .tile img { width: 200px; }
</style></head>
<body><div class="card">
  <div class="g">
    <div class="tile" style="background:#fff; border:1px solid var(--kh-line);"><img src="../assets/logo/kheelona-wordmark.svg" style="filter: drop-shadow(0 4px 4px rgba(0,0,0,0.25));"></div>
    <div class="tile" style="background:var(--kh-cream);"><img src="../assets/logo/kheelona-wordmark.svg" style="filter: drop-shadow(0 4px 4px rgba(0,0,0,0.25));"></div>
    <div class="tile" style="background:var(--kh-blue);"><img src="../assets/logo/kheelona-wordmark-white.svg"></div>
    <div class="tile" style="background:var(--kh-orange);"><img src="../assets/logo/kheelona-wordmark-white.svg"></div>
  </div>
  <p class="note">Full-color wordmark on White or Cream. White wordmark on Sky Blue, Deep Orange, Yellow, photos, and dark surfaces.</p>
</div></body></html>
