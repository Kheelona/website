<!doctype html>
<!-- @dsCard group="Shapes" name="Noise textures" subtitle="Tactile grain overlays" viewport="560x240" -->
<html><head><meta charset="utf-8"><title>Noise textures</title>
<link rel="stylesheet" href="_card.css">
<style>
  .g { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .p { aspect-ratio: 1; border-radius: 12px; overflow: hidden; border: 1px solid var(--kh-line); position: relative; }
  .p img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .t { text-align: center; font-size: 10.5px; color: var(--kh-ink-3); margin-top: 5px; }
</style></head>
<body><div class="card">
  <div class="g">
    <div><div class="p" style="background:var(--kh-yellow);"><img src="../assets/textures/noise-1.png" style="opacity:.5; mix-blend-mode:overlay;"></div><div class="t">noise-1</div></div>
    <div><div class="p" style="background:var(--kh-blue);"><img src="../assets/textures/noise-2.png" style="opacity:.5; mix-blend-mode:overlay;"></div><div class="t">noise-2</div></div>
    <div><div class="p" style="background:var(--kh-orange);"><img src="../assets/textures/noise-fine.png" style="opacity:.45; mix-blend-mode:overlay;"></div><div class="t">noise-fine</div></div>
    <div><div class="p" style="background:var(--kh-cream);"><img src="../assets/textures/noise-white.png" style="opacity:.9;"></div><div class="t">noise-white</div></div>
  </div>
  <p class="note">Overlay on flat brand colors (30–50% opacity, overlay blend) for the tactile "Cool Shape" feel from the symbol library.</p>
</div></body></html>
