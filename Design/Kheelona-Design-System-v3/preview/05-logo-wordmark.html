<!doctype html>
<!-- @dsCard group="Logo" name="Primary wordmark" subtitle="Full-color vector + symbolism" viewport="720x340" -->
<html><head><meta charset="utf-8"><title>Primary wordmark</title>
<link rel="stylesheet" href="_card.css">
<style>
  .stage { background: var(--kh-cream); border-radius: 14px; display: flex; align-items: center; justify-content: center; padding: 34px; }
  .stage img { width: 380px; filter: drop-shadow(0 4px 4px rgba(0,0,0,0.25)); }
  .sym { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; font-size: 12.5px; line-height: 1.4; color: var(--kh-ink-2); }
  .sym b { display:block; color: var(--kh-ink); font-family: var(--kh-font-display); font-size: 13.5px; }
</style></head>
<body><div class="card">
  <div class="stage"><img src="../assets/logo/kheelona-wordmark.svg" alt="Kheelona wordmark"></div>
  <div class="sym">
    <div><b>The 'K' (Heart) — Care &amp; Companionship</b>Grounds the brand in emotional warmth: companionship and a safe environment are the foundation of the Kheelona experience.</div>
    <div><b>The 'O' (4-Point Star) — Playful Tech Ed</b>The dynamic energy of modern learning: a symbol of future-focused, engaging technology education.</div>
  </div>
</div></body></html>
