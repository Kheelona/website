<!doctype html>
<!-- @dsCard group="Colors" name="Primary colors" subtitle="Orange · Yellow · Sky Blue · White" viewport="720x280" -->
<html><head><meta charset="utf-8"><title>Primary colors</title>
<link rel="stylesheet" href="_card.css">
<style>
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
  .swatch { aspect-ratio: 1.3/1; border-radius: 12px; display: flex; align-items: flex-end; padding: 14px; box-sizing: border-box; }
  .name { font-family: var(--kh-font-display); font-weight: 700; font-size: 16px; line-height: 1.1; color: #fff; }
  .hex { font-family: ui-monospace, Menlo, monospace; font-size: 12px; color: #fff; opacity: .9; margin-top: 3px; }
</style></head>
<body><div class="card">
  <div class="grid">
    <div class="swatch" style="background:var(--kh-orange);"><div><div class="name">Deep Orange</div><div class="hex">#EF762F · 10%</div></div></div>
    <div class="swatch" style="background:var(--kh-yellow);"><div><div class="name">Golden Yellow</div><div class="hex">#F1A23B · 30%</div></div></div>
    <div class="swatch" style="background:var(--kh-blue);"><div><div class="name">Sky Blue</div><div class="hex">#29A0D7 · 20%</div></div></div>
    <div class="swatch" style="background:#fff; border:1px solid var(--kh-line);"><div><div class="name" style="color:var(--kh-ink);">White</div><div class="hex" style="color:var(--kh-ink-3);">#FFFFFF · 30%</div></div></div>
  </div>
  <p class="note">Orange = energy and physical activity; golden yellow adds optimism and happiness. Blue is the universal colour of trust, logic and communication — the anchor for the technology side of the brand.</p>
</div></body></html>
