<!doctype html>
<!-- @dsCard group="Mascot" name="Pose library" subtitle="17 transparent renders, emotion-mapped" viewport="780x480" -->
<html><head><meta charset="utf-8"><title>Pose library</title>
<link rel="stylesheet" href="_card.css">
<style>
  .g { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; }
  .p { background: var(--kh-cream); border-radius: 12px; padding: 8px; text-align: center; }
  .p img { width: 100%; height: 84px; object-fit: contain; }
  .p .t { font-size: 10.5px; color: var(--kh-ink-3); margin-top: 4px; }
</style></head>
<body><div class="card">
  <div class="g">
    <div class="p"><img src="../assets/mascot/poses/cheering-laughing.png"><div class="t">cheering</div></div>
    <div class="p"><img src="../assets/mascot/poses/sitting-eyes-open.png"><div class="t">sitting</div></div>
    <div class="p"><img src="../assets/mascot/poses/sitting-laughing.png"><div class="t">laughing</div></div>
    <div class="p"><img src="../assets/mascot/poses/sitting-pointing.png"><div class="t">pointing (sit)</div></div>
    <div class="p"><img src="../assets/mascot/poses/sitting-cute.png"><div class="t">cute</div></div>
    <div class="p"><img src="../assets/mascot/poses/sitting-giggling.png"><div class="t">giggling</div></div>
    <div class="p"><img src="../assets/mascot/poses/superman-flying.png"><div class="t">flying</div></div>
    <div class="p"><img src="../assets/mascot/poses/standing-hero-cape.png"><div class="t">hero cape</div></div>
    <div class="p"><img src="../assets/mascot/poses/standing-pointing.png"><div class="t">pointing</div></div>
    <div class="p"><img src="../assets/mascot/poses/standing-arms-open.png"><div class="t">welcome</div></div>
    <div class="p"><img src="../assets/mascot/poses/standing-salute.png"><div class="t">salute</div></div>
    <div class="p"><img src="../assets/mascot/poses/standing-thinking.png"><div class="t">thinking</div></div>
    <div class="p"><img src="../assets/mascot/poses/peeking-waving.png"><div class="t">peeking wave</div></div>
    <div class="p"><img src="../assets/mascot/poses/peeking-wink.png"><div class="t">peeking wink</div></div>
    <div class="p"><img src="../assets/mascot/poses/taking-notes.png"><div class="t">taking notes</div></div>
    <div class="p"><img src="../assets/mascot/poses/hugging-teddy.png"><div class="t">teddy hug</div></div>
    <div class="p"><img src="../assets/mascot/poses/sitting-crying.png"><div class="t">crying (rare)</div></div>
  </div>
  <p class="note">Pick the pose whose emotion matches the message — mapping in guidelines/mascot.md. Keep ≥ 96 px tall so the face reads.</p>
</div></body></html>
