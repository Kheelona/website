<!doctype html>
<!-- @dsCard group="Logo" name="K-mark" subtitle="Standalone mark for avatars, badges, app icon" viewport="560x300" -->
<html><head><meta charset="utf-8"><title>K-mark</title>
<link rel="stylesheet" href="_card.css">
<style>
  .g { display: flex; gap: 14px; align-items: stretch; }
  .tile { border-radius: 16px; display: flex; align-items: center; justify-content: center; flex: 1; padding: 20px; }
  .tile img { width: 74px; }
  .chip { width: 96px; height: 96px; border-radius: 24px; background: var(--kh-blue); display:flex; align-items:center; justify-content:center; box-shadow: var(--kh-shadow); }
  .chip img { width: 52px; }
</style></head>
<body><div class="card">
  <div class="g">
    <div class="tile" style="background:#fff; border:1px solid var(--kh-line);"><img src="../assets/logo/kheelona-mark.svg"></div>
    <div class="tile" style="background:var(--kh-yellow-tint);"><img src="../assets/logo/kheelona-mark.svg"></div>
    <div class="tile" style="background:var(--kh-cream);"><div class="chip"><img src="../assets/logo/kheelona-mark.svg" style="filter: brightness(0) invert(1);" alt=""></div></div>
  </div>
  <p class="note">The K heart + teardrop stands alone in avatars, favicons, chest badges, and the app icon tile. Reference sheet: assets/logo/app-icon-sheet.png.</p>
</div></body></html>
