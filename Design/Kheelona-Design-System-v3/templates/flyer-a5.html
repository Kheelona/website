<!doctype html>
<!-- @dsCard group="Templates" name="Flyer A5" subtitle="Pamphlet front artboard (559×794 @ 96dpi)" viewport="559x794" -->
<html><head><meta charset="utf-8"><title>Flyer A5</title>
<link rel="stylesheet" href="../tokens/kheelona.css">
<style>
  html, body { margin: 0; padding: 0; }
  .board { width: 559px; height: 794px; position: relative; overflow: hidden; background: #fff; box-sizing: border-box; display: flex; flex-direction: column; }
  .hero { background: linear-gradient(180deg, var(--kh-blue) 0%, #56B8E2 100%); position: relative; height: 400px; display: flex; align-items: flex-end; justify-content: center; overflow: hidden; }
  .hero .logo { position: absolute; top: 28px; left: 32px; width: 150px; }
  .hero .mascot { width: 300px; margin-bottom: -6px; }
  .shape { position: absolute; opacity: .18; }
  .body { padding: 34px 36px 28px; display: flex; flex-direction: column; flex: 1; }
  .headline { font-family: var(--kh-font-display); font-weight: 700; font-size: 36px; letter-spacing: -0.01em; line-height: 1.15; color: var(--kh-ink); margin: 0; }
  .points { margin: 18px 0 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 10px; }
  .points li { font-family: var(--kh-font-text); font-size: 15.5px; letter-spacing: 0.01em; line-height: 1.3; color: var(--kh-ink-2); padding-left: 26px; position: relative; }
  .points li::before { content: ''; position: absolute; left: 0; top: 3px; width: 14px; height: 14px; border-radius: 50%; background: var(--kh-teal); }
  .points li:nth-child(2)::before { background: var(--kh-orange); }
  .points li:nth-child(3)::before { background: var(--kh-purple); }
  .foot { margin-top: auto; display: flex; align-items: center; justify-content: space-between; }
  .cta { font-family: var(--kh-font-display); font-weight: 600; font-size: 18px; color: #fff; background: var(--kh-orange); border-radius: 999px; padding: 12px 28px; box-shadow: var(--kh-shadow); }
  .site { font-family: var(--kh-font-text); font-size: 14px; color: var(--kh-ink-3); }
</style></head>
<body><div class="board">
  <div class="hero">
    <img class="logo" src="../assets/logo/kheelona-wordmark-white.svg" alt="Kheelona">
    <img class="shape" src="../assets/shapes/flower-5.svg" style="width:130px; top:30px; right:-30px; filter: brightness(0) invert(1);">
    <img class="shape" src="../assets/shapes/triangle-5.svg" style="width:90px; bottom:60px; left:-20px; filter: brightness(0) invert(1);">
    <img class="mascot" src="../assets/mascot/poses/hugging-teddy.png" alt="">
  </div>
  <div class="body">
    <h1 class="headline">A best friend who happens to be a brilliant tutor.</h1>
    <ul class="points">
      <li><b>Safe by design</b> — protective, parent-approved conversations, always.</li>
      <li><b>Screen-free learning</b> — robotics, stories and play instead of tablets.</li>
      <li><b>Grows with your child</b> — age-appropriate content from 2 to 5.</li>
    </ul>
    <div class="foot">
      <div class="cta">Book a demo</div>
      <div class="site">kheelona.com</div>
    </div>
  </div>
</div></body></html>
