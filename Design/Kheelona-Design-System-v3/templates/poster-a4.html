<!doctype html>
<!-- @dsCard group="Templates" name="Poster A4" subtitle="Print poster artboard (794×1123 @ 96dpi)" viewport="794x1123" -->
<html><head><meta charset="utf-8"><title>Poster A4</title>
<link rel="stylesheet" href="../tokens/kheelona.css">
<style>
  html, body { margin: 0; padding: 0; }
  .board { width: 794px; height: 1123px; position: relative; overflow: hidden; background: var(--kh-yellow); box-sizing: border-box; }
  .grain { position: absolute; inset: 0; background: url('../assets/textures/noise-1.png'); background-size: 512px; opacity: .25; mix-blend-mode: overlay; }
  .shape { position: absolute; opacity: .2; }
  .panel { position: absolute; left: 48px; right: 48px; top: 48px; bottom: 48px; background: #fff; border-radius: 24px; padding: 52px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; text-align: center; box-shadow: var(--kh-shadow-soft); }
  .kicker { font-family: var(--kh-font-editorial); font-style: italic; font-size: 24px; color: var(--kh-blue); margin: 0; }
  .headline { font-family: var(--kh-font-display); font-weight: 700; font-size: 62px; letter-spacing: -0.01em; line-height: 1.12; color: var(--kh-ink); margin: 16px 0 0; }
  .headline em { font-style: normal; color: var(--kh-orange); }
  .mascot { width: 380px; margin: 26px 0 10px; }
  .sub { font-family: var(--kh-font-text); font-size: 20px; letter-spacing: 0.01em; line-height: 1.3; color: var(--kh-ink-2); margin: 0; max-width: 520px; }
  .meta { margin-top: auto; display: flex; flex-direction: column; align-items: center; gap: 18px; }
  .when { font-family: var(--kh-font-display); font-weight: 600; font-size: 24px; color: var(--kh-ink); background: var(--kh-blue-tint); border-radius: 999px; padding: 12px 34px; }
  .logo { width: 170px; }
</style></head>
<body><div class="board">
  <div class="grain"></div>
  <img class="shape" src="../assets/shapes/flower-13.svg" style="width:190px; top:-50px; left:-56px; filter: brightness(0) invert(1);">
  <img class="shape" src="../assets/shapes/polygon.svg" style="width:150px; bottom:-30px; right:-30px; filter: brightness(0) invert(1);">
  <div class="panel">
    <p class="kicker">A play afternoon for curious families</p>
    <h1 class="headline">Come talk to a toy <em>that talks back.</em></h1>
    <img class="mascot" src="../assets/mascot/poses/standing-arms-open.png" alt="">
    <p class="sub">Bring your little one (ages 2–5) and watch a conversation become a lesson — no screens anywhere.</p>
    <div class="meta">
      <div class="when">Saturday · 10 AM – 1 PM · Cubbon Park, Bangalore</div>
      <img class="logo" src="../assets/logo/kheelona-wordmark.svg" alt="Kheelona">
    </div>
  </div>
</div></body></html>
