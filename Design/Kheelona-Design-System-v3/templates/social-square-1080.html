<!doctype html>
<!-- @dsCard group="Templates" name="Social square 1080" subtitle="Instagram/LinkedIn post artboard" viewport="1080x1080" -->
<html><head><meta charset="utf-8"><title>Social square 1080</title>
<link rel="stylesheet" href="../tokens/kheelona.css">
<style>
  html, body { margin: 0; padding: 0; }
  .board { width: 1080px; height: 1080px; position: relative; overflow: hidden; background: var(--kh-cream); box-sizing: border-box; }
  .wash { position: absolute; inset: 0; background: linear-gradient(160deg, var(--kh-yellow-tint) 0%, #FFFFFF 55%, var(--kh-blue-tint) 100%); }
  .shape { position: absolute; opacity: .14; }
  .content { position: absolute; inset: 72px; display: flex; flex-direction: column; }
  .logo { width: 240px; }
  .headline { font-family: var(--kh-font-display); font-weight: 700; font-size: 84px; letter-spacing: -0.01em; line-height: 1.15; color: var(--kh-ink); margin: 56px 0 0; max-width: 640px; }
  .headline em { font-style: normal; color: var(--kh-orange); }
  .sub { font-family: var(--kh-font-text); font-size: 30px; letter-spacing: 0.01em; line-height: 1.3; color: var(--kh-ink-2); margin: 28px 0 0; max-width: 560px; }
  .cta { margin-top: auto; align-self: flex-start; font-family: var(--kh-font-display); font-weight: 600; font-size: 30px; color: #fff; background: var(--kh-orange); border-radius: 999px; padding: 20px 48px; box-shadow: var(--kh-shadow); }
  .mascot { position: absolute; right: -52px; bottom: -10px; width: 560px; }
</style></head>
<body><div class="board">
  <div class="wash"></div>
  <img class="shape" src="../assets/shapes/flower-5.svg" style="width:190px; top:-60px; right:120px; filter: invert(58%) sepia(65%) saturate(2593%) hue-rotate(346deg) brightness(97%) contrast(93%);">
  <img class="shape" src="../assets/shapes/flower-13.svg" style="width:150px; left:-50px; bottom:180px; filter: invert(56%) sepia(83%) saturate(1273%) hue-rotate(164deg) brightness(93%) contrast(87%);">
  <div class="content">
    <img class="logo" src="../assets/logo/kheelona-wordmark.svg" alt="Kheelona">
    <h1 class="headline">Toys that talk. <em>Minds that bloom.</em></h1>
    <p class="sub">A friendly AI tutor your child can hold, hug, and chat with — no screens, just curiosity.</p>
    <div class="cta">Meet Kheelona</div>
  </div>
  <img class="mascot" src="../assets/mascot/poses/cheering-laughing.png" alt="">
</div></body></html>
