<!doctype html>
<!-- @dsCard group="Templates" name="Content card" subtitle="Announcement / blog / quote card (640×800)" viewport="640x800" -->
<html><head><meta charset="utf-8"><title>Content card</title>
<link rel="stylesheet" href="../tokens/kheelona.css">
<style>
  html, body { margin: 0; padding: 0; }
  .board { width: 640px; height: 800px; position: relative; overflow: hidden; background: var(--kh-cream); box-sizing: border-box; padding: 56px; display: flex; flex-direction: column; }
  .shape { position: absolute; opacity: .13; }
  .tag { align-self: flex-start; font-family: var(--kh-font-text); font-weight: 600; font-size: 14px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--kh-ink); background: var(--kh-yellow); border-radius: 999px; padding: 8px 20px; }
  .quote { font-family: var(--kh-font-editorial); font-style: italic; font-size: 40px; line-height: 1.3; color: var(--kh-ink); margin: 40px 0 0; }
  .attrib { font-family: var(--kh-font-text); font-size: 18px; letter-spacing: 0.01em; color: var(--kh-ink-3); margin: 24px 0 0; }
  .foot { margin-top: auto; display: flex; align-items: flex-end; justify-content: space-between; }
  .logo { width: 170px; margin-bottom: 10px; }
  .mascot { width: 190px; margin-right: -20px; }
</style></head>
<body><div class="board">
  <img class="shape" src="../assets/shapes/flower-4.svg" style="width:200px; top:-60px; right:-60px; filter: invert(58%) sepia(65%) saturate(2593%) hue-rotate(346deg) brightness(97%) contrast(93%);">
  <img class="shape" src="../assets/shapes/squircle.svg" style="width:150px; bottom:200px; left:-60px; filter: invert(56%) sepia(83%) saturate(1273%) hue-rotate(164deg) brightness(93%) contrast(87%);">
  <div class="tag">Parent stories</div>
  <p class="quote">"My daughter asked her toy why the moon follows our car. It told her — and then asked her a better question back."</p>
  <p class="attrib">— Priya, mom of a 4-year-old, Bangalore</p>
  <div class="foot">
    <img class="logo" src="../assets/logo/kheelona-wordmark.svg" alt="Kheelona">
    <img class="mascot" src="../assets/mascot/poses/sitting-giggling.png" alt="">
  </div>
</div></body></html>
