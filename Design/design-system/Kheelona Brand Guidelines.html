document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

   rgba(239,118,47,0.15);\n  --kh-yellow-15:     rgba(241,162,59,0.15);\n  --kh-blue-15:       rgba(58,164,229,0.15);\n  --kh-teal-15:       rgba(26,188,156,0.15);\n  --kh-purple-15:     rgba(139,91,255,0.15);\n\n  /* ── Neutrals ──────────────────────────────────────────────────── */\n  --kh-ink:           #000000;   /* Headings */\n  --kh-ink-2:         #272727;   /* Body text */\n  --kh-ink-3:         #363636;   /* Secondary text */\n  --kh-ink-4:         #727272;   /* Muted / captions */\n  --kh-line:          #CFCFCF;   /* Card border */\n  --kh-line-soft:     #E2E2E2;   /* Subtle dividers */\n  --kh-line-softer:   #E8E8E8;   /* Very subtle backgrounds */\n  --kh-divider:       #838383;   /* Mid-strength rule */\n\n  /* ── Surfaces ──────────────────────────────────────────────────── */\n  --kh-bg:            #FFFFFF;\n  --kh-bg-warm:       #FFF7EE;   /* Subtle warm fill for sections, derived from orange */\n  --kh-bg-cool:       #EAF6FC;   /* Subtle cool fill, derived from blue */\n\n  /* ── Typography ───────────────────────────────────────────────── */\n  --kh-font-display:  'Glory', system-ui, sans-serif;\n  --kh-font-text:     'Instrument Sans', system-ui, sans-serif;\n  --kh-font-accent:   'Instrument Serif', Georgia, serif;\n\n  /* Headings: tight, Disney-bouncy */\n  --kh-h1-size:       128px;\n  --kh-h1-lh:         1.0;\n  --kh-h1-tracking:   -0.03em;\n\n  --kh-h2-size:       64px;\n  --kh-h2-lh:         1.1;\n  --kh-h2-tracking:   -0.02em;\n\n  --kh-h3-size:       36px;\n  --kh-h3-lh:         1.15;\n  --kh-h3-tracking:   -0.01em;\n\n  --kh-h4-size:       32px;\n  --kh-h4-lh:         1.2;\n  --kh-h4-tracking:   -0.01em;\n\n  --kh-body-size:     24px;\n  --kh-body-lh:       1.3;       /* 130% per source */\n  --kh-body-tracking: 0.01em;    /* +1% Glory; 0% Instrument Sans */\n\n  --kh-small-size:    16px;\n  --kh-small-lh:      1.3;\n\n  /* ── Spacing scale (multiples of 4) ────────────────────────────── */\n  --kh-s-1: 4px;\n  --kh-s-2: 8px;\n  --kh-s-3: 12px;\n  --kh-s-4: 16px;\n  --kh-s-5: 24px;\n  --kh-s-6: 32px;\n  --kh-s-7: 48px;\n  --kh-s-8: 64px;\n  --kh-s-9: 96px;\n  --kh-s-10: 128px;\n\n  /* ── Radii ─────────────────────────────────────────────────────── */\n  --kh-r-sm:   6px;\n  --kh-r-md:   10px;   /* default card */\n  --kh-r-lg:   16px;\n  --kh-r-xl:   24px;\n  --kh-r-block: 28%;   /* logo \"K\" capsule — proportional rounding */\n  --kh-r-pill: 999px;\n\n  /* ── Shadows (the one shadow) ──────────────────────────────────── */\n  --kh-shadow:        0 4px 4px rgba(0,0,0,0.25);\n  --kh-shadow-soft:   0 2px 6px rgba(0,0,0,0.10);\n  --kh-shadow-sticker: 0 0 0 5px #fff, 0 4px 4px rgba(0,0,0,0.25);\n\n  /* ── Motion ────────────────────────────────────────────────────── */\n  --kh-ease-bounce: cubic-bezier(0.34, 1.56, 0.64, 1);\n  --kh-ease-out:    cubic-bezier(0.2, 0.8, 0.2, 1);\n  --kh-dur-fast:    160ms;\n  --kh-dur-base:    220ms;\n  --kh-dur-slow:    320ms;\n}\n\n/* ── Semantic helpers ─────────────────────────────────────────────── */\n\nhtml, body {\n  font-family: var(--kh-font-text);\n  font-size: var(--kh-body-size);\n  line-height: var(--kh-body-lh);\n  color: var(--kh-ink-2);\n  background: var(--kh-bg);\n}\n\n.kh-h1, h1.kh {\n  font-family: var(--kh-font-display);\n  font-weight: 700;\n  font-size: var(--kh-h1-size);\n  line-height: var(--kh-h1-lh);\n  letter-spacing: var(--kh-h1-tracking);\n  color: var(--kh-ink);\n}\n.kh-h2, h2.kh {\n  font-family: var(--kh-font-text);\n  font-weight: 700;\n  font-size: var(--kh-h2-size);\n  line-height: var(--kh-h2-lh);\n  letter-spacing: var(--kh-h2-tracking);\n  color: var(--kh-ink);\n}\n.kh-h3, h3.kh {\n  font-family: var(--kh-font-text);\n  font-weight: 700;\n  font-size: var(--kh-h3-size);\n  line-height: var(--kh-h3-lh);\n  letter-spacing: var(--kh-h3-tracking);\n  color: var(--kh-ink);\n}\n.kh-h4, h4.kh {\n  font-family: var(--kh-font-text);\n  font-weight: 600;\n  font-size: var(--kh-h4-size);\n  line-height: var(--kh-h4-lh);\n  color: var(--kh-ink);\n}\n.kh-display {\n  font-family: var(--kh-font-display);\n  font-weight: 700;\n}\n.kh-eyebrow {\n  font-family: var(--kh-font-accent);\n  font-style: italic;\n  font-weight: 400;\n  font-size: 32px;\n  letter-spacing: 0.01em;\n  color: var(--kh-ink);\n}\n.kh-body {\n  font-family: var(--kh-font-text);\n  font-size: var(--kh-body-size);\n  line-height: var(--kh-body-lh);\n  color: var(--kh-ink-2);\n}\n.kh-small {\n  font-size: var(--kh-small-size);\n  line-height: var(--kh-small-lh);\n  color: var(--kh-ink-3);\n}\n.kh-mono {\n  font-family: 'JetBrains Mono', ui-monospace, monospace;\n  font-size: 14px;\n}\n\n/* The little hand-drawn tick under section titles */\n.kh-tick {\n  display: inline-block;\n  width: 90px;\n  height: 8px;\n  background: var(--kh-orange);\n  border-radius: 4px;\n  transform: rotate(2deg);\n  margin-top: 12px;\n}\n\n/* The orange footer \"kheelona\" pill marker used at the bottom of every page */\n.kh-marker {\n  display: inline-flex;\n  align-items: center;\n  justify-content: center;\n  padding: 10px 22px;\n  background: var(--kh-orange);\n  border: 1.5px solid #fff;\n  box-shadow: var(--kh-shadow);\n  border-radius: 6px;\n  color: #fff;\n  font-family: var(--kh-font-display);\n  font-weight: 700;\n  letter-spacing: 0.02em;\n}\n\n/* Cards */\n.kh-card {\n  background: #fff;\n  border: 1px solid var(--kh-line);\n  border-radius: var(--kh-r-md);\n  padding: var(--kh-s-6);\n}\n\n/* Buttons */\n.kh-btn {\n  font-family: var(--kh-font-text);\n  font-weight: 600;\n  font-size: 18px;\n  line-height: 1;\n  border: none;\n  cursor: pointer;\n  border-radius: var(--kh-r-pill);\n  padding: 14px 28px;\n  transition: transform var(--kh-dur-fast) var(--kh-ease-bounce),\n              background-color var(--kh-dur-base) var(--kh-ease-out),\n              box-shadow var(--kh-dur-base) var(--kh-ease-out);\n}\n.kh-btn-primary {\n  background: var(--kh-orange);\n  color: #fff;\n  box-shadow: var(--kh-shadow);\n  border: 2px solid #fff;\n}\n.kh-btn-primary -self: center;\n  display: inline-flex;\n  align-items: center;\n  justify-content: center;\n  padding: 18px 38px;\n  background: var(--kh-orange);\n  border: 2px solid #fff;\n  box-shadow: var(--kh-shadow);\n  border-radius: 8px;\n  color: #fff;\n  font-family: var(--kh-font-display);\n  font-weight: 700;\n  font-size: 28px;\n  letter-spacing: 0.02em;\n}\n.s-footer .page {\n  justify-self: end;\n  font-family: var(--kh-font-display);\n  font-weight: 700;\n  font-size: 32px;\n  color: var(--kh-ink);\n}\n\n/* The signature decorative cluster — 3×3 of 15%-tints bleeding off corner */\n.s-cluster {\n  position: absolute;\n  width: 1012px;\n  height: 1012px;\n  pointer-events: none;\n  display: grid;\n  grid-template-columns: repeat(3, 1fr);\n  grid-template-rows: repeat(3, 1fr);\n}\n.s-cluster .tile {\n  -webkit-mask-size: 100% 100%;\n  mask-size: 100% 100%;\n  -webkit-mask-repeat: no-repeat;\n  mask-repeat: no-repeat;\n}\n\n/* Shape utility — set background-color + mask-image inline */\n.shape {\n  -webkit-mask-size: 100% 100%; mask-size: 100% 100%;\n  -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat;\n  -webkit-mask-position: center; mask-position: center;\n}\n\n/* Character (shape + face inline SVG) */\n.character { position: relative; }\n.character > .body { position: absolute; inset: 0; }\n.character > svg.face { position: absolute; inset: 0; width: 100%; height: 100%; }\n<\u002Fstyle>\n  <script type=\"application/json\" id=\"speaker-notes\">[\n    \"Cover slide. Open with the brand mark and let the character collage land. Five characters, five hues — that's the entire visual vocabulary in one glance.\",\n    \"Brand vision slide. Read the line as written: restore curiosity, encourage them to speak, make kids like kids again. Three actions, no fluff.\",\n    \"Core values. Three pillars: screen-free freedom, confidence through conversation, problem-solving with fun. Each one maps to a parent worry you've already seen on social.\",\n    \"Color system. Four         <g transform=\"translate(20,28)\"><circle cx=\"14\" cy=\"14\" r=\"14\" fill=\"#fff\"><\u002Fcircle><circle cx=\"14\" cy=\"15\" r=\"11\" fill=\"#000\"><\u002Fcircle><circle cx=\"22\" cy=\"20\" r=\"2\" fill=\"#fff\"><\u002Fcircle><\u002Fg>\n        <g transform=\"translate(52,28)\"><circle cx=\"14\" cy=\"14\" r=\"14\" fill=\"#fff\"><\u002Fcircle><circle cx=\"14\" cy=\"15\" r=\"11\" fill=\"#000\"><\u002Fcircle><circle cx=\"22\" cy=\"20\" r=\"2\" fill=\"#fff\"><\u002Fcircle><\u002Fg>\n        <ellipse cx=\"50\" cy=\"70\" rx=\"10\" ry=\"6\" fill=\"#FF2A2A\"><\u002Fellipse>\n      <\u002Fsvg>\n    <\u002Fdiv>\n    <div class=\"character\" style=\"width: 280px; height: 280px; transform: rotate(-3deg);\">\n      <div class=\"body shape\" style=\"background: var(--kh-blue); -webkit-mask-image: url(&quot;d8577d43-6e2f-4b19-91a3-5958ac48cea2&quot;); mask-image: url(&quot;d8577d43-6e2f-4b19-91a3-5958ac48cea2&quot;);\"><\u002Fdiv>\n      <svg class=\"face\" viewBox=\"0 0 100 100\">\n        <g transform=\"translate(20,30)\"><circle cx=\"14\" cy=\"14\" r=\"14\" fill=\"#fff\"><\u002Fcircle><circle cx=\"14\" cy=\"15\" r=\"11\" fill=\"#000\"><\u002Fcircle><circle cx=\"22\" cy=\"20\" r=\"2\" fill=\"#fff\"><\u002Fcircle><\u002Fg>\n        <g transform=\"translate(52,30)\"><circle cx=\"14\" cy=\"14\" r=\"14\" fill=\"#fff\"><\u002Fcircle><circle cx=\"14\" cy=\"15\" r=\"11\" fill=\"#000\"><\u002Fcircle><circle cx=\"22\" cy=\"20\" r=\"2\" fill=\"#fff\"><\u002Fcircle><\u002Fg>\n        <ellipse cx=\"50\" cy=\"72\" rx=\"12\" ry=\"6\" fill=\"#FF2A2A\"><\u002Fellipse>\n      <\u002Fsvg>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- Title block -->\n  <div style=\"position:absolute; left: 0; right: 0; top: 56%; text-align: center;\">\n    <h1 style=\"font-family: var(--kh-font-text); font-weight: 700; font-size: 200px; letter-spacing: -0.035em; line-height: 1; margin: 0; color: var(--kh-ink);\">Brand Guidelines<\u002Fh1>\n    <p style=\"font-family: var(--kh-font-display); font-size: 40px;
