<!doctype html>
<!-- @dsCard group="Colors" name="Decorative cluster" subtitle="15% alpha shape cluster" viewport="700x260" -->
<html><head><meta charset="utf-8"><title>15% decoratives</title>
<link rel="stylesheet" href="_card.css">
<style>
  .grid { display:grid; grid-template-columns: repeat(5, 1fr); gap: 12px; }
  .tile { aspect-ratio: 1; border-radius: 14px; display:flex; align-items:flex-end; padding: 10px; }
  .lbl { font-family:'JetBrains Mono', monospace; font-size: 10px; color: var(--kh-ink-3); }
</style></head>
<body><div class="card">
  <div class="grid">
    <div class="tile" style="background:var(--kh-orange-15);"><span class="lbl">EF762F · 15%</span></div>
    <div class="tile" style="background:var(--kh-yellow-15);"><span class="lbl">F1A23B · 15%</span></div>
    <div class="tile" style="background:var(--kh-blue-15);"><span class="lbl">3AA4E5 · 15%</span></div>
    <div class="tile" style="background:var(--kh-teal-15);"><span class="lbl">1ABC9C · 15%</span></div>
    <div class="tile" style="background:var(--kh-purple-15);"><span class="lbl">8B5BFF · 15%</span></div>
  </div>
  <p class="note" style="margin:0;">The exact opacity used for every decorative shape in the background "playmat" cluster — never any other tint.</p>
</div></body></html>
