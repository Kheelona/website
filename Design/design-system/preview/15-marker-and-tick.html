<!doctype html>
<!-- @dsCard group="Components" name="Page marker & tick" subtitle="Orange pill marker + section tick" viewport="700x200" -->
<html><head><meta charset="utf-8"><title>Marker & tick</title>
<link rel="stylesheet" href="_card.css">
<style>
  .stage { display: flex; flex-direction: column; gap: 28px; align-items: flex-start; padding: 12px 0; }
  .title-row { display:flex; flex-direction:column; gap: 8px; }
  .footer-row { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 16px; width: 100%; }
  .bg { font-family:'Instrument Sans',sans-serif; font-weight: 700; font-size: 22px; letter-spacing: -0.03em; color: var(--kh-ink); }
  .pg { font-family:'Glory',sans-serif; font-weight: 700; font-size: 22px; color: var(--kh-ink); text-align: right; }
</style></head>
<body><div class="card">
  <div class="stage">
    <div class="title-row">
      <div><span style="font-family:'Instrument Sans';font-weight:700;font-size:32px;letter-spacing:-0.02em;color:var(--kh-ink);">Primary Colors</span></div>
      <div class="kh-tick" style="width: 110px; height: 8px;"></div>
    </div>
    <div class="footer-row">
      <span class="bg">Brand Guidelines</span>
      <span class="kh-marker">kheelona</span>
      <span class="pg">14</span>
    </div>
  </div>
  <p class="note" style="margin:0;">Two recurring brand-page elements: the slanted orange <em>tick</em> under section titles (a hand-drawn underline) and the orange pill <em>marker</em> at the footer center.</p>
</div></body></html>
