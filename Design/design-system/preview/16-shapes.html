<!doctype html>
<!-- @dsCard group="Brand" name="Shape primitives" subtitle="Five SVG brand shapes" viewport="700x220" -->
<html><head><meta charset="utf-8"><title>Brand shapes</title>
<link rel="stylesheet" href="_card.css">
<style>
  .grid { display:grid; grid-template-columns: repeat(7, 1fr); gap: 12px; align-items: end; }
  .item { display:flex; flex-direction: column; align-items:center; gap: 8px; }
  .shape { width: 60px; height: 60px; -webkit-mask-size: contain; mask-size: contain; -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat; -webkit-mask-position: center; mask-position: center; }
  .lbl { font-family:'JetBrains Mono', monospace; font-size: 10px; color: var(--kh-ink-3); text-align:center; line-height:1.2;}
</style></head>
<body><div class="card">
  <div class="grid">
    <div class="item"><div class="shape" style="background: var(--kh-orange); -webkit-mask-image: url(../assets/shapes/squircle.svg); mask-image: url(../assets/shapes/squircle.svg);"></div><span class="lbl">squircle</span></div>
    <div class="item"><div class="shape" style="background: var(--kh-yellow); -webkit-mask-image: url(../assets/shapes/flower-3.svg); mask-image: url(../assets/shapes/flower-3.svg);"></div><span class="lbl">flower-3</span></div>
    <div class="item"><div class="shape" style="background: var(--kh-teal); -webkit-mask-image: url(../assets/shapes/flower-4.svg); mask-image: url(../assets/shapes/flower-4.svg);"></div><span class="lbl">flower-4</span></div>
    <div class="item"><div class="shape" style="background: var(--kh-purple); -webkit-mask-image: url(../assets/shapes/flower-5.svg); mask-image: url(../assets/shapes/flower-5.svg);"></div><span class="lbl">flower-5</span></div>
    <div class="item"><div class="shape" style="background: var(--kh-blue); -webkit-mask-image: url(../assets/shapes/flower-13.svg); mask-image: url(../assets/shapes/flower-13.svg);"></div><span class="lbl">flower-13</span></div>
    <div class="item"><div class="shape" style="background: var(--kh-orange); -webkit-mask-image: url(../assets/shapes/polygon.svg); mask-image: url(../assets/shapes/polygon.svg);"></div><span class="lbl">polygon</span></div>
    <div class="item"><div class="shape" style="background: var(--kh-yellow); -webkit-mask-image: url(../assets/shapes/triangle-5.svg); mask-image: url(../assets/shapes/triangle-5.svg);"></div><span class="lbl">triangle-5</span></div>
  </div>
  <p class="note" style="margin:0;">Seven primitives form the entire decorative + mascot vocabulary. Tint via <span class="mono">background-color</span> on a masked div, or inline the SVG with <span class="mono">fill="currentColor"</span>.</p>
</div></body></html>
