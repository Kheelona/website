<!doctype html>
<!-- @dsCard group="Spacing" name="Radius scale" subtitle="Card 10px, button pill" viewport="700x180" -->
<html><head><meta charset="utf-8"><title>Radii</title>
<link rel="stylesheet" href="_card.css">
<style>
  .grid { display:grid; grid-template-columns: repeat(5, 1fr); gap: 12px; }
  .swatch { aspect-ratio: 1.4 / 1; background: var(--kh-orange); display:flex; flex-direction:column; align-items:center; justify-content:center; color:#fff; font-family:'Glory',sans-serif; font-weight:700; font-size: 14px; }
  .px { font-family:'JetBrains Mono', monospace; font-size: 11px; opacity: .85; }
</style></head>
<body><div class="card">
  <div class="grid">
    <div class="swatch" style="border-radius:6px;">sm<span class="px">6px</span></div>
    <div class="swatch" style="border-radius:10px;">md<span class="px">10px</span></div>
    <div class="swatch" style="border-radius:16px;">lg<span class="px">16px</span></div>
    <div class="swatch" style="border-radius:24px;">xl<span class="px">24px</span></div>
    <div class="swatch" style="border-radius:999px;">pill<span class="px">999px</span></div>
  </div>
  <p class="note" style="margin:0;">Default card radius is <span class="mono">md / 10px</span>. The orange "next page" marker uses <span class="mono">sm / 6px</span>. CTA buttons go full pill.</p>
</div></body></html>
