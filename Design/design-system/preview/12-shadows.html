<!doctype html>
<!-- @dsCard group="Spacing" name="Shadows" subtitle="Single sticker-shadow recipe" viewport="700x180" -->
<html><head><meta charset="utf-8"><title>Shadows</title>
<link rel="stylesheet" href="_card.css">
<style>
  .row { display:flex; gap: 28px; align-items:center; flex-wrap:wrap; }
  .chip { width: 160px; aspect-ratio: 1.4/1; background: #fff; border-radius: 10px; display:flex; align-items:center; justify-content:center; font-family:'Glory',sans-serif; font-weight: 700; color: var(--kh-ink); }
  .lbl { font-family:'Instrument Sans'; font-size: 12px; color: var(--kh-ink-4); margin-top: 8px; text-transform: uppercase; letter-spacing: 0.06em; font-weight: 600; }
  .px { font-family:'JetBrains Mono', monospace; font-size: 11px; color: var(--kh-ink-3); }
  .item { text-align: center; }
</style></head>
<body><div class="card" style="background: var(--kh-bg-warm);">
  <div class="row" style="justify-content:space-around;">
    <div class="item">
      <div class="chip" style="box-shadow: var(--kh-shadow);">shadow</div>
      <div class="lbl">Default</div>
      <div class="px">0 4 4 / .25</div>
    </div>
    <div class="item">
      <div class="chip" style="box-shadow: var(--kh-shadow-soft);">soft</div>
      <div class="lbl">Soft</div>
      <div class="px">0 2 6 / .10</div>
    </div>
    <div class="item">
      <div class="chip" style="box-shadow: var(--kh-shadow-sticker);">sticker</div>
      <div class="lbl">Sticker</div>
      <div class="px">+5px white stroke</div>
    </div>
  </div>
  <p class="note" style="margin:0;text-align:center;">One shadow recipe — small, dark, slightly distant. Cards prefer the hairline border instead.</p>
</div></body></html>
