<!doctype html>
<!-- @dsCard group="Colors" name="Primary colors" subtitle="Orange, Yellow, Blue, Paper White" viewport="700x220" -->
<html><head><meta charset="utf-8"><title>Primary colors</title>
<link rel="stylesheet" href="_card.css">
<style>
  .swatch { width: 100%; aspect-ratio: 1.4 / 1; border-radius: 10px; display:flex; align-items:flex-end; padding: 14px; box-sizing:border-box; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
  .name { font-family:'Glory',sans-serif; font-weight: 700; font-size: 16px; line-height: 1; color: #fff; }
  .hex { font-family:'JetBrains Mono', monospace; font-size: 12px; color: #fff; opacity:.85; margin-top: 4px; }
  .name.dark, .hex.dark { color: var(--kh-ink); }
  .name.dark { color: var(--kh-ink); }
  .hex.dark { color: var(--kh-ink-3); }
</style></head>
<body><div class="card">
  <div class="grid">
    <div class="swatch" style="background:var(--kh-orange);"><div><div class="name">Orange</div><div class="hex">#EF762F</div></div></div>
    <div class="swatch" style="background:var(--kh-yellow);"><div><div class="name">Yellow</div><div class="hex">#F1A23B</div></div></div>
    <div class="swatch" style="background:var(--kh-blue);"><div><div class="name">Sky Blue</div><div class="hex">#29A0D7</div></div></div>
    <div class="swatch" style="background:#FFFFFF;border:1px solid var(--kh-line);"><div><div class="name dark">White</div><div class="hex dark">#FFFFFF</div></div></div>
  </div>
  <p class="note" style="margin:0;">The four primaries. Orange is the always-on accent (10%); Yellow + White anchor the canvas (60% combined); Blue is the "tech" anchor (20%).</p>
</div></body></html>
