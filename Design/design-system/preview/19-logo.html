<!doctype html>
<!-- @dsCard group="Brand" name="Logo" subtitle="Wordmark + sticker stroke" viewport="700x260" -->
<html><head><meta charset="utf-8"><title>Logo</title>
<link rel="stylesheet" href="_card.css">
<style>
  .logo-wrap { display:flex; justify-content: center; padding: 12px 0 4px; }
  .logo-wrap img { max-width: 100%; height: auto; max-height: 140px; }
  .specs { display:grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .spec { background: var(--kh-bg-warm); border-radius: 8px; padding: 10px 12px; }
  .spec .h { font-family:'Instrument Sans'; font-size: 11px; color: var(--kh-ink-4); text-transform: uppercase; letter-spacing: 0.06em; font-weight: 600; margin-bottom: 4px; }
  .spec .b { font-family:'JetBrains Mono', monospace; font-size: 12px; color: var(--kh-ink); line-height: 1.4; }
</style></head>
<body><div class="card">
  <div class="logo-wrap"><img src="../assets/logo-wordmark.png" alt="kheelona wordmark"></div>
  <div class="specs">
    <div class="spec"><div class="h">Min size</div><div class="b">25 px tall</div></div>
    <div class="spec"><div class="h">Stroke</div><div class="b">5px outside #FFF</div></div>
    <div class="spec"><div class="h">Shadow</div><div class="b">0 4px 4 / 25%</div></div>
  </div>
  <p class="note" style="margin:0;">Logo is a "sticker" — outlined white, dropped on a soft black shadow. Two letter colors: <span style="color:var(--kh-orange);font-weight:700;">orange</span> base + <span style="color:var(--kh-blue);font-weight:700;">blue</span> on K-flag and final A. Never use the construction guides outside of artwork files.</p>
</div></body></html>
