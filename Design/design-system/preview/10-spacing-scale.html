<!doctype html>
<!-- @dsCard group="Spacing" name="Spacing scale" subtitle="4 → 200px tokens" viewport="700x220" -->
<html><head><meta charset="utf-8"><title>Spacing scale</title>
<link rel="stylesheet" href="_card.css">
<style>
  .row-s { display:grid; grid-template-columns: 60px 60px 1fr; align-items:center; gap: 16px; padding: 4px 0; }
  .tk { font-family:'Instrument Sans'; font-size: 12px; color: var(--kh-ink-4); text-transform: uppercase; letter-spacing: 0.06em; font-weight: 600; }
  .px { font-family:'JetBrains Mono', monospace; font-size: 12px; color: var(--kh-ink-3); }
  .bar { height: 12px; background: var(--kh-orange); border-radius: 4px; }
</style></head>
<body><div class="card" style="gap:6px;">
  <div class="row-s"><span class="tk">s-1</span><span class="px">4px</span><span class="bar" style="width:4px;"></span></div>
  <div class="row-s"><span class="tk">s-2</span><span class="px">8px</span><span class="bar" style="width:8px;"></span></div>
  <div class="row-s"><span class="tk">s-3</span><span class="px">12px</span><span class="bar" style="width:12px;"></span></div>
  <div class="row-s"><span class="tk">s-4</span><span class="px">16px</span><span class="bar" style="width:16px;"></span></div>
  <div class="row-s"><span class="tk">s-5</span><span class="px">24px</span><span class="bar" style="width:24px;"></span></div>
  <div class="row-s"><span class="tk">s-6</span><span class="px">32px</span><span class="bar" style="width:32px;"></span></div>
  <div class="row-s"><span class="tk">s-7</span><span class="px">48px</span><span class="bar" style="width:48px;"></span></div>
  <div class="row-s"><span class="tk">s-8</span><span class="px">64px</span><span class="bar" style="width:64px;"></span></div>
  <div class="row-s"><span class="tk">s-9</span><span class="px">96px</span><span class="bar" style="width:96px;"></span></div>
  <div class="row-s"><span class="tk">s-10</span><span class="px">128px</span><span class="bar" style="width:128px;"></span></div>
</div></body></html>
