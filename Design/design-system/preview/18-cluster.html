<!doctype html>
<!-- @dsCard group="Brand" name="Decorative cluster in use" subtitle="The playmat cluster in context" viewport="700x320" -->
<html><head><meta charset="utf-8"><title>Decorative cluster</title>
<link rel="stylesheet" href="_card.css">
<style>
  body { background: var(--kh-bg); }
  .stage { position: relative; height: 280px; background: #fff; border-radius: 10px; overflow: hidden; border: 1px solid var(--kh-line); }
  .stage .s { position: absolute; -webkit-mask-size: 100% 100%; mask-size: 100% 100%; -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat; }
  .copy { position: absolute; left: 24px; top: 50%; transform: translateY(-50%); max-width: 60%; }
  .copy h3 { font-family:'Instrument Sans'; font-weight:700; font-size: 26px; letter-spacing:-0.02em; margin: 0 0 6px; color: var(--kh-ink); }
  .copy p { font-family:'Instrument Sans'; font-size: 14px; color: var(--kh-ink-3); margin: 0; line-height: 1.4; }
</style></head>
<body><div class="card">
  <div class="stage">
    <!-- 2x3 grid of 15% tile shapes pinned to right -->
    <div class="s" style="right: 8px; top: 8px; width: 100px; height: 100px; background: var(--kh-blue-15); -webkit-mask-image: url(../assets/shapes/polygon.svg); mask-image: url(../assets/shapes/polygon.svg);"></div>
    <div class="s" style="right: 112px; top: 8px; width: 100px; height: 100px; background: var(--kh-yellow-15); -webkit-mask-image: url(../assets/shapes/flower-3.svg); mask-image: url(../assets/shapes/flower-3.svg);"></div>
    <div class="s" style="right: 216px; top: 8px; width: 100px; height: 100px; background: var(--kh-purple-15); -webkit-mask-image: url(../assets/shapes/triangle-5.svg); mask-image: url(../assets/shapes/triangle-5.svg);"></div>
    <div class="s" style="right: 8px; top: 116px; width: 100px; height: 100px; background: var(--kh-yellow-15); -webkit-mask-image: url(../assets/shapes/flower-4.svg); mask-image: url(../assets/shapes/flower-4.svg);"></div>
    <div class="s" style="right: 112px; top: 116px; width: 100px; height: 100px; background: var(--kh-teal-15); -webkit-mask-image: url(../assets/shapes/squircle.svg); mask-image: url(../assets/shapes/squircle.svg);"></div>
    <div class="s" style="right: 216px; top: 116px; width: 100px; height: 100px; background: var(--kh-orange-15); -webkit-mask-image: url(../assets/shapes/flower-5.svg); mask-image: url(../assets/shapes/flower-5.svg);"></div>
    <div class="copy">
      <h3>The playmat pattern</h3>
      <p>One cluster per page, bleeding off the corner. Six shapes × five 15%-alpha hues × ~120px tile.</p>
    </div>
  </div>
  <p class="note" style="margin:0;">This is the only decorative motif in the system. Never centered, never tiled, never repeated on consecutive spreads.</p>
</div></body></html>
