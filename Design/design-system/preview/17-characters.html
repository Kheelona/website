<!doctype html>
<!-- @dsCard group="Brand" name="Characters" subtitle="Shape + face composition" viewport="700x260" -->
<html><head><meta charset="utf-8"><title>Characters</title>
<link rel="stylesheet" href="_card.css">
<style>
  .row { display:flex; gap: 14px; justify-content: space-between; align-items: flex-end; }
  .char { width: 100px; height: 100px; position: relative; }
  .char .body {
    position: absolute; inset: 0;
    -webkit-mask-size: 100% 100%; mask-size: 100% 100%;
    -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat;
  }
  .lbl { font-family:'JetBrains Mono', monospace; font-size: 10px; color: var(--kh-ink-3); text-align:center; margin-top:6px; }
</style></head>
<body><div class="card">
  <div class="row">
    <div>
      <div class="char">
        <div class="body" style="background: var(--kh-orange); -webkit-mask-image: url(../assets/shapes/squircle.svg); mask-image: url(../assets/shapes/squircle.svg);"></div>
        <!-- eyes + mouth -->
        <svg viewBox="0 0 100 100" style="position:absolute;inset:0;">
          <g transform="translate(20,28)"><circle cx="14" cy="14" r="14" fill="#fff"/><circle cx="14" cy="15" r="11" fill="#000"/><circle cx="22" cy="20" r="2" fill="#fff"/></g>
          <g transform="translate(52,28)"><circle cx="14" cy="14" r="14" fill="#fff"/><circle cx="14" cy="15" r="11" fill="#000"/><circle cx="22" cy="20" r="2" fill="#fff"/></g>
          <ellipse cx="50" cy="71" rx="11" ry="5" fill="#FF2A2A"/>
        </svg>
      </div>
      <div class="lbl">squircle · happy</div>
    </div>
    <div>
      <div class="char">
        <div class="body" style="background: var(--kh-blue); -webkit-mask-image: url(../assets/shapes/triangle-5.svg); mask-image: url(../assets/shapes/triangle-5.svg);"></div>
        <svg viewBox="0 0 100 100" style="position:absolute;inset:0;">
          <g transform="translate(22,32)"><circle cx="13" cy="13" r="11" fill="#fff"/><circle cx="13" cy="13" r="8" fill="#000"/></g>
          <g transform="translate(52,32)"><circle cx="13" cy="13" r="11" fill="#fff"/><circle cx="13" cy="13" r="8" fill="#000"/></g>
          <path d="M40 65 Q50 75 60 65" fill="none" stroke="#000" stroke-width="3" stroke-linecap="round"/>
        </svg>
      </div>
      <div class="lbl">triangle-5 · curious</div>
    </div>
    <div>
      <div class="char">
        <div class="body" style="background: var(--kh-teal); -webkit-mask-image: url(../assets/shapes/flower-13.svg); mask-image: url(../assets/shapes/flower-13.svg);"></div>
        <svg viewBox="0 0 100 100" style="position:absolute;inset:0;">
          <g transform="translate(22,28)"><circle cx="14" cy="14" r="12" fill="#fff"/><circle cx="14" cy="17" r="9" fill="#000"/></g>
          <g transform="translate(50,28)"><circle cx="14" cy="14" r="12" fill="#fff"/><circle cx="14" cy="17" r="9" fill="#000"/></g>
          <circle cx="50" cy="70" r="3" fill="#FF2A2A"/>
        </svg>
      </div>
      <div class="lbl">flower-13 · ooh</div>
    </div>
    <div>
      <div class="char">
        <div class="body" style="background: var(--kh-purple); -webkit-mask-image: url(../assets/shapes/polygon.svg); mask-image: url(../assets/shapes/polygon.svg);"></div>
        <svg viewBox="0 0 100 100" style="position:absolute;inset:0;">
          <path d="M25 38 Q33 30 41 38" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
          <path d="M59 38 Q67 30 75 38" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
          <ellipse cx="50" cy="65" rx="10" ry="6" fill="#FF2A2A"/>
        </svg>
      </div>
      <div class="lbl">polygon · sleepy</div>
    </div>
    <div>
      <div class="char">
        <div class="body" style="background: var(--kh-yellow); -webkit-mask-image: url(../assets/shapes/flower-5.svg); mask-image: url(../assets/shapes/flower-5.svg);"></div>
        <svg viewBox="0 0 100 100" style="position:absolute;inset:0;">
          <g transform="translate(22,32)"><circle cx="13" cy="13" r="11" fill="#fff"/><circle cx="13" cy="13" r="8" fill="#000"/><circle cx="19" cy="18" r="2" fill="#fff"/></g>
          <g transform="translate(52,32)"><circle cx="13" cy="13" r="11" fill="#fff"/><circle cx="13" cy="13" r="8" fill="#000"/><circle cx="19" cy="18" r="2" fill="#fff"/></g>
          <path d="M37 65 Q50 78 63 65 Z" fill="#FF2A2A"/>
        </svg>
      </div>
      <div class="lbl">flower-5 · giggling</div>
    </div>
  </div>
  <p class="note" style="margin:0;">Each character = brand shape + two eyes (upper third) + one mouth (lower third). Mouths use Alert Red. Pull from the 17 eyes × 26 mouths combinatorial face library.</p>
</div></body></html>
