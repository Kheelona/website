<!doctype html>
<!-- @dsCard group="Components" name="Buttons" subtitle="Primary pill, secondary, tertiary" viewport="700x240" -->
<html><head><meta charset="utf-8"><title>Buttons</title>
<link rel="stylesheet" href="_card.css">
<style>
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px 24px; align-items:center; }
  .lbl { font-family:'Instrument Sans'; font-size: 11px; color: var(--kh-ink-4); text-transform: uppercase; letter-spacing: 0.08em; font-weight: 600; margin-bottom: 8px; }
  .row { display:flex; gap: 12px; flex-wrap:wrap; align-items:center; }
</style></head>
<body><div class="card">
  <div class="grid">
    <div>
      <div class="lbl">Primary</div>
      <div class="row">
        <button class="kh-btn kh-btn-primary">Next Page</button>
        <button class="kh-btn kh-btn-primary" style="background:var(--kh-orange-deep);">Hover</button>
      </div>
    </div>
    <div>
      <div class="lbl">Ghost</div>
      <div class="row">
        <button class="kh-btn kh-btn-ghost">Learn more</button>
        <button class="kh-btn kh-btn-ghost" style="background:var(--kh-ink);color:#fff;">Hover</button>
      </div>
    </div>
    <div>
      <div class="lbl">Sizes</div>
      <div class="row">
        <button class="kh-btn kh-btn-primary" style="padding: 10px 18px; font-size: 14px;">Small</button>
        <button class="kh-btn kh-btn-primary">Default</button>
        <button class="kh-btn kh-btn-primary" style="padding: 18px 36px; font-size: 22px;">Large</button>
      </div>
    </div>
    <div>
      <div class="lbl">Disabled</div>
      <div class="row">
        <button class="kh-btn kh-btn-primary" style="opacity:.5; cursor:not-allowed;" disabled>Next Page</button>
      </div>
    </div>
  </div>
  <p class="note" style="margin:0;">Primary is pill-rounded with a 2px white inset border and the default shadow. On hover it darkens; on press it scales to 0.96 with a bouncy cubic easing.</p>
</div></body></html>
