<!doctype html>
<!-- @dsCard group="Colors" name="Secondary colors" subtitle="Mint Teal & Magic Purple accents" viewport="700x200" -->
<html><head><meta charset="utf-8"><title>Secondary colors</title>
<link rel="stylesheet" href="_card.css">
<style>
  .swatch { width: 100%; aspect-ratio: 1.4 / 1; border-radius: 10px; display:flex; align-items:flex-end; padding: 14px; box-sizing:border-box; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
  .name { font-family:'Glory',sans-serif; font-weight: 700; font-size: 16px; line-height: 1; color: #fff; }
  .hex { font-family:'JetBrains Mono', monospace; font-size: 12px; color: #fff; opacity:.85; margin-top: 4px; }
</style></head>
<body><div class="card">
  <div class="grid">
    <div class="swatch" style="background:var(--kh-teal);"><div><div class="name">Mint Teal</div><div class="hex">#1ABC9C</div></div></div>
    <div class="swatch" style="background:var(--kh-purple);"><div><div class="name">Magic Purple</div><div class="hex">#8B5BFF</div></div></div>
    <div class="swatch" style="background:var(--kh-red);"><div><div class="name">Alert Red</div><div class="hex">#FF2A2A</div></div></div>
  </div>
  <p class="note" style="margin:0;">Teal = the <em>result</em> of using the tech (cognitive freshness). Purple = the magic spark of AI. Red is reserved exclusively for character mouths — never as a UI alert.</p>
</div></body></html>
