<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>IconButton — preview</title></head>
<body>
<div id="root" class="kh-row" style="padding:32px;gap:16px"></div>
<script>
  var K = window.Kheelona, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(h(React.Fragment, null,
    h(K.IconButton, { icon: 'list', label: 'Menu' }),
    h(K.IconButton, { icon: 'x', label: 'Close' }),
    h(K.IconButton, { icon: 'dots-three', label: 'More options' }),
    h(K.IconButton, { icon: 'share-network', label: 'Share', variant: 'outline' }),
    h(K.IconButton, { icon: 'heart', label: 'Save story', variant: 'outline' }),
    h(K.IconButton, { icon: 'pencil-simple', label: 'Edit name', variant: 'outline', size: 's' }),
    h(K.IconButton, { icon: 'play', label: 'Play story', variant: 'primary' }),
    h(K.IconButton, { icon: 'microphone', label: 'Talk to Kheelu', variant: 'primary', size: 'l' }),
    h(K.IconButton, { icon: 'trash', label: 'Delete', variant: 'outline', disabled: true })));
</script>
</body>
</html>
