<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Select — preview</title></head>
<body>
<div id="root" class="kh-grid" style="grid-template-columns:repeat(auto-fit,minmax(280px,1fr));padding:32px;align-items:start"></div>
<script>
  var K = window.Kheelona, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(h(React.Fragment, null,
    h(K.Select, { label: 'Second story language', defaultValue: 'kn', hint: 'Kheelu tells stories in English and this language.',
      options: [ { value: 'hi', label: 'Hindi' }, { value: 'bn', label: 'Bengali' }, { value: 'te', label: 'Telugu' }, { value: 'ta', label: 'Tamil' }, { value: 'kn', label: 'Kannada' } ] }),
    h(K.Select, { label: 'Child\u2019s age', placeholder: 'Choose an age', defaultValue: '', options: ['3', '4', '5', '6', '7 or older'], error: 'Choose an age so stories fit.' })));
</script>
</body>
</html>
