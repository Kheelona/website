<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>FeelingChip — preview</title></head>
<body>
<div id="root" class="kh-stack" style="padding:32px"></div>
<script>
  var K = window.Kheelona, h = React.createElement;
  var f = ['curious', 'grumpy', 'sad', 'silly', 'joy'];
  ReactDOM.createRoot(document.getElementById('root')).render(h(React.Fragment, null,
    h('div', { className: 'kh-row', style: { padding: 0 } }, f.map(function (x) { return h(K.FeelingChip, { key: x, feeling: x }); })),
    h('div', { className: 'kh-row', style: { padding: 0, alignItems: 'stretch' } }, f.map(function (x) { return h(K.FeelingChip, { key: x, feeling: x, card: true }); }))));
</script>
</body>
</html>
