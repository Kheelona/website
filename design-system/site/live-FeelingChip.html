<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="runtime/frame.js"></script>
<link rel="stylesheet" href="runtime/tokens.css">
<link rel="stylesheet" href="runtime/bundle.css">
<script src="runtime/react.production.min.js"></script>
<script src="runtime/react-dom.production.min.js"></script>
<script src="runtime/bundle.js"></script>
<script src="runtime/assets-map.js"></script>

<title>FeelingChip · Kheelona</title>

</head>
<body>
<div id="root" class="kh-stack" style="padding:32px"></div>
<script>
  var K = window.Kheelona, h = React.createElement;
  var f = ['curious', 'grumpy', 'sad', 'silly', 'joy'];
  ReactDOM.createRoot(document.getElementById('root')).render(h(React.Fragment, null,
    h('div', { className: 'kh-row', style: { padding: 0 } }, f.map(function (x) { return h(K.FeelingChip, { key: x, feeling: x }); })),
    h('div', { className: 'kh-row', style: { padding: 0, alignItems: 'stretch' } }, f.map(function (x) { return h(K.FeelingChip, { key: x, feeling: x, card: true }); }))));
</script>
</body>
</html>
