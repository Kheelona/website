<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="runtime/frame.js"></script>
<link rel="stylesheet" href="runtime/tokens.css">
<link rel="stylesheet" href="runtime/bundle.css">
<script src="runtime/react.production.min.js"></script>
<script src="runtime/react-dom.production.min.js"></script>
<script src="runtime/bundle.js"></script>
<script src="runtime/assets-map.js"></script>

<title>TabBar · Kheelona</title>

</head>
<body>
<div id="root" class="kh-stack" style="padding:32px"></div>
<script>
  var K = window.Kheelona, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(h('div', { style: { maxWidth: 390, margin: '0 auto', border: '1px solid var(--border)', borderRadius: 24, overflow: 'hidden', background: 'var(--surface)' } },
    h('div', { style: { height: 40 } }),
    h(K.TabBar, { value: 'chats', items: [
      { id: 'home', label: 'Today', icon: 'house' },
      { id: 'chats', label: 'Conversations', icon: 'chat-circle-dots', badge: 3 },
      { id: 'stories', label: 'Stories', icon: 'book-open' },
      { id: 'settings', label: 'Settings', icon: 'gear' } ] })));
</script>
</body>
</html>
