<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="runtime/frame.js"></script>
<link rel="stylesheet" href="runtime/tokens.css">
<link rel="stylesheet" href="runtime/bundle.css">
<script src="runtime/react.production.min.js"></script>
<script src="runtime/react-dom.production.min.js"></script>
<script src="runtime/bundle.js"></script>
<script src="runtime/assets-map.js"></script>

<title>Toast · Kheelona</title>

</head>
<body>
<div id="root" class="kh-stack" style="padding:32px;gap:12px;align-items:flex-start"></div>
<script>
  var K = window.Kheelona, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(h(React.Fragment, null,
    h(K.Toast, { tone: 'success' }, 'Quiet hours saved'),
    h(K.Toast, { icon: 'trash', action: { label: 'Undo' } }, 'Conversation deleted'),
    h(K.Toast, { tone: 'danger', action: { label: 'Retry' }, onClose: function () {} }, 'Couldn\u2019t save. Check your connection.')));
</script>
</body>
</html>
