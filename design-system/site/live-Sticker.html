<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="runtime/frame.js"></script>
<link rel="stylesheet" href="runtime/tokens.css">
<link rel="stylesheet" href="runtime/bundle.css">
<script src="runtime/react.production.min.js"></script>
<script src="runtime/react-dom.production.min.js"></script>
<script src="runtime/bundle.js"></script>
<script src="runtime/assets-map.js"></script>

<title>Sticker · Kheelona</title>

</head>
<body>
<div id="root" class="kh-row" style="gap:28px;padding:32px"></div>
<script>
  var K = window.Kheelona, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(h(React.Fragment, null,
    h(K.Sticker, { tone: 'sun' }, 'First 500 only'),
    h(K.Sticker, { tone: 'chilli', tilt: 3 }, 'Ages 3+'),
    h(K.Sticker, { tone: 'blue', icon: 'shield-check', tilt: -2 }, 'Screen-free'),
    h(K.Sticker, { tone: 'chilli', hand: true, tilt: 4 }, 'made in Bengaluru'),
    h(K.Sticker, { tone: 'blue', icon: 'translate' }, 'Up to 10 languages'),
    h(K.Sticker, { tone: 'sun', round: true, big: '\u20B9499', tilt: -8 }, 'reserves yours')));
</script>
</body>
</html>
