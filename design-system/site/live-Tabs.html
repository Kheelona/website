<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="runtime/frame.js"></script>
<link rel="stylesheet" href="runtime/tokens.css">
<link rel="stylesheet" href="runtime/bundle.css">
<script src="runtime/react.production.min.js"></script>
<script src="runtime/react-dom.production.min.js"></script>
<script src="runtime/bundle.js"></script>
<script src="runtime/assets-map.js"></script>

<title>Tabs · Kheelona</title>

</head>
<body>
<div id="root" class="kh-stack" style="padding:32px;gap:40px"></div>
<script>
  var K = window.Kheelona, h = React.createElement;
  function Line(t) { return h('p', { style: { margin: 0, color: 'var(--text-muted)' } }, t); }
  ReactDOM.createRoot(document.getElementById('root')).render(h(React.Fragment, null,
    h(K.Tabs, { label: 'Conversations', tabs: [
      { id: 'today', label: 'Today', count: 4, content: Line('4 conversations, 18 minutes, 6 new words.') },
      { id: 'week', label: 'This week', count: 23, content: Line('23 conversations this week.') },
      { id: 'all', label: 'All', content: Line('Every conversation since Kheelu arrived.') } ] }),
    h(K.Tabs, { variant: 'pill', label: 'Summary', defaultValue: 'topics', tabs: [
      { id: 'words', label: 'Words', icon: 'translate', content: Line('planet, orbit, gravity, crater') },
      { id: 'topics', label: 'Topics', icon: 'book-open', content: Line('Space, feelings, counting') },
      { id: 'feelings', label: 'Feelings', icon: 'smiley', content: Line('Curious most of the day, a little grumpy at bath time.') } ] })));
</script>
</body>
</html>
