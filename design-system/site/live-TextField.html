<title>TextField · Kheelona</title>

<body>
<div id="root" class="kh-grid" style="grid-template-columns:repeat(auto-fit,minmax(260px,1fr));padding:32px"></div>
<script>
  var K = window.Kheelona, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(h(React.Fragment, null,
    h(K.TextField, { label: 'Your child\u2019s first name', placeholder: 'Myra', hint: 'Kheelu uses it to say hello.' }),
    h(K.TextField, { label: 'Birthday', defaultValue: '31/02/2022', error: 'That date does not exist. Try a date like 14/02/2022.' })));
</script>
</body>
