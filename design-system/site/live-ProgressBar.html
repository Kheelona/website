<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="runtime/frame.js"></script>
<link rel="stylesheet" href="runtime/tokens.css">
<link rel="stylesheet" href="runtime/bundle.css">
<script src="runtime/react.production.min.js"></script>
<script src="runtime/react-dom.production.min.js"></script>
<script src="runtime/bundle.js"></script>
<script src="runtime/assets-map.js"></script>

<title>ProgressBar · Kheelona</title>

</head>
<body>
<div id="root" class="kh-stack" style="padding:32px;gap:20px;max-width:560px"></div>
<script>
  var K = window.Kheelona, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(h(React.Fragment, null,
    h(K.ProgressBar, { label: 'Setting up Kheelu', value: 3, max: 4, valueText: 'Step 3 of 4', showValue: true }),
    h(K.ProgressBar, { label: 'Downloading Story mode', value: 62, showValue: true }),
    h(K.ProgressBar, { label: '412 of 500 reserved at this price', value: 412, max: 500, tone: 'chilli', showValue: false }),
    h('div', { className: 'kh-row', style: { padding: 0, gap: 20 } },
      h(K.Spinner, { label: 'Loading' }), h(K.Spinner, { size: 32 }), h(K.Button, { variant: 'primary', loading: true }, 'Connecting'))));
</script>
</body>
</html>
