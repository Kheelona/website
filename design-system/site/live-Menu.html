<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="runtime/frame.js"></script>
<link rel="stylesheet" href="runtime/tokens.css">
<link rel="stylesheet" href="runtime/bundle.css">
<script src="runtime/react.production.min.js"></script>
<script src="runtime/react-dom.production.min.js"></script>
<script src="runtime/bundle.js"></script>

<title>Menu · Kheelona</title>

</head>
<body>
<div id="root" class="kh-row" style="align-items:flex-start;padding:32px;gap:24px"></div>
<script>
  var K = window.Kheelona, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(h(React.Fragment, null,
    h(K.Menu, { label: 'Tara\u2019s Kheelu', icon: 'gear', defaultOpen: true, items: [
      { label: 'Languages', icon: 'translate', hint: 'Kannada, Bengali' },
      { label: 'Quiet hours', icon: 'moon', hint: '8:30 pm' },
      { label: 'Topics', icon: 'sliders-horizontal' },
      { divider: true },
      { label: 'Share today\u2019s summary', icon: 'share-network' },
      { label: 'Export conversations', icon: 'download-simple', disabled: true },
      { divider: true },
      { label: 'Delete today\u2019s conversation', icon: 'trash', danger: true } ] }),
    h('div', { style: { marginLeft: 'auto' } },
      h(K.Menu, { icon: 'dots-three', ariaLabel: 'Story options', align: 'end', items: [
        { label: 'Play again', icon: 'play' }, { label: 'Save story', icon: 'heart' }, { label: 'Copy link', icon: 'link-simple' } ] }))));
</script>
</body>
