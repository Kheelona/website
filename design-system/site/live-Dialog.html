<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="runtime/frame.js"></script>
<link rel="stylesheet" href="runtime/tokens.css">
<link rel="stylesheet" href="runtime/bundle.css">
<script src="runtime/react.production.min.js"></script>
<script src="runtime/react-dom.production.min.js"></script>
<script src="runtime/bundle.js"></script>
<script src="runtime/assets-map.js"></script>

<title>Dialog · Kheelona</title>

</head>
<body>
<div id="root" class="kh-grid" style="grid-template-columns:repeat(auto-fit,minmax(320px,1fr));padding:32px 32px 0;align-items:start"></div>
<script>
  var K = window.Kheelona, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(h(React.Fragment, null,
    h(K.Dialog, { inline: true, title: 'Delete today\u2019s conversation?', onClose: function () {},
      actions: [ { label: 'Cancel', variant: 'secondary' }, { label: 'Delete', variant: 'danger', icon: 'trash' } ] },
      h('p', null, 'This removes Tara\u2019s conversation from Tue, 6 Oct. You can\u2019t undo this.')),
    h('div', { style: { alignSelf: 'end' } },
      h(K.BottomSheet, { inline: true, title: 'Story language', actions: [ { label: 'Save', variant: 'primary' } ] },
        h(K.RadioGroup, { name: 'sheet-lang', defaultValue: 'kn', options: [ { value: 'en', label: 'English' }, { value: 'kn', label: 'Kannada' }, { value: 'bn', label: 'Bengali' } ] })))));
</script>
</body>
</html>
