<div id="root" class="kh-row" style="justify-content:center;padding:32px"></div>

  var K = window.Kheelona, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(h(K.ParentControl, { items: [

    { icon: 'book-open', tone: 'sun', label: 'Stories only after 8 pm', hint: 'No new topics at bedtime.', checked: true },
