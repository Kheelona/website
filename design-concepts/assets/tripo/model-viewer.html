<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kheelona mascot · 3D preview</title>
<script type="module" src="https://unpkg.com/@google/model-viewer@3.5.0/dist/model-viewer.min.js"></script>
<style>
  html, body { margin: 0; height: 100%; }
  body { display: flex; flex-direction: column; background: #FFF7EE; font-family: system-ui; }
  header { padding: 14px 20px; font-weight: 700; color: #1C1C1C; }
  model-viewer { flex: 1; width: 100%; }
</style>
</head>
<body>
<header>kheelona-mascot.glb · rigged + idle animation (drag to rotate, scroll to zoom)</header>
<model-viewer
  src="kheelona-mascot.glb"
  autoplay
  animation-name="NlaTrack"
  camera-controls
  shadow-intensity="1"
  exposure="1.1"
  camera-orbit="180deg 86deg 4m"
  style="background: radial-gradient(circle at 50% 30%, #FFF7EE 0%, #FBEBD9 100%);">
</model-viewer>
</body>
</html>
